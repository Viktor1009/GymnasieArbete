<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test</title>
  <style>
    * {
      padding: 0px;
      margin: 0px;
    }

    body.no-game {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #24283b;
    }

    h1, h2, h3, h4, h5, h6 {
      color: aliceblue;
    }

    header {
      flex: 0 0 auto;
    }

    section#mainPage {
      flex: 1 0 auto;
    }

    footer {
      flex: 0 0 auto;
      background-color: #1a1b26;
      display: flex;
      padding-left: 10%;
      padding-right: 10%;
    }

    footer div {
      flex: 1;
    }

    div.socials {
      padding-left: 10px;
      padding-right: 10px;
    }

    div.socials div {
      display: flex;
      align-items: flex-start;
    }

    .socials-container {
      width: 30px;
      height: 30px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .socials-container img {
      width: 100%;
      height: 100%;
      -o-object-fit: contain;
        object-fit: contain;
    }

    #frontPageImage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #frontPageImage img {
      width: 50%;
    }

    #shaperunfast-viewport {
      background-color: grey;
    }

    #baseFloor {
      border: 3px solid black;
      position: absolute;
      width: 100vw;
      top: 85%;
      left: 0;
    }

    #player {
      position: absolute;
      bottom: 15%;
      left: 20%;
      width: 50px;
      height: 50px;
      border: 3px solid hotpink;
    }

    .triangle {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 35px solid red;
      position: absolute;
    }/*# sourceMappingURL=style.css.map */
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="score">0</div>
  <script>
window.addEventListener("DOMContentLoaded", () => {
    const pointSystem = points();
    const collisionSystem = collision();
    triangle(pointSystem, collisionSystem);
    player();
});

function points() {
  let points = 0;

  function updatePointDisplay() {
      const pointDiv = document.getElementById("score");
      if (pointDiv) {
          pointDiv.textContent = points;
      }
  }

  function addPoint() {
      points++;
      updatePointDisplay();
  }

  function deathpointDisplay(deathDiv) {
      const finalPointsDisplay = document.createElement("div");
      finalPointsDisplay.textContent = points;
      deathDiv.appendChild(finalPointsDisplay);
  }

  updatePointDisplay();
  return {
      addPoint,
      deathpointDisplay
  };
}

function collision() {

  function deathDisplay() {
      const deathDiv = document.createElement("div");
      deathDiv.className = "deathDiv";
      document.body.appendChild(deathDiv);
      return deathDiv;
  }

  return {
      deathDisplay
  };
}

function triangle(pointSystem, collisionSystem) {
  const triangleSpeed = 7;
  let shouldMove = true;

  setInterval(spawnTriangle, 1500);

  function spawnTriangle() {
    const triangle = document.createElement("div");
    triangle.className = "triangle";
    let deadly = true;
    

    const y = window.innerHeight * 0.15;
    triangle.style.bottom = `${y}px`;
    let x = window.innerWidth + 20;
    triangle.style.left = `${x}px`;
    document.body.appendChild(triangle);

    let counted = false;

    function moveTriangle() {
        x -= triangleSpeed;
        triangle.style.left = `${x}px`;

        const triangleDimension = triangle.getBoundingClientRect();
        const playerElement = document.getElementById("player");
        const playerDimension = playerElement.getBoundingClientRect();

        if (!counted && triangleDimension.right < playerDimension.left) {
            counted = true;
            pointSystem.addPoint();
        }

        if (
            deadly &&
            playerDimension.bottom > triangleDimension.top &&
            playerDimension.right > triangleDimension.left
        ) {
            const deathDiv = collisionSystem.deathDisplay();
            pointSystem.deathpointDisplay(deathDiv);
            shouldMove = false;
        }

        if (triangleDimension.left < playerDimension.left + 56) {
            deadly = false;
        }

        if (x > -20) {
            if(shouldMove){
              requestAnimationFrame(moveTriangle);
            }
        } else {
            triangle.remove();
        }
    }
    requestAnimationFrame(moveTriangle);
  }
}

function player() {
  const player = document.getElementById("player");
  let y = parseFloat(getComputedStyle(player).bottom);
  const jumpHeight = 140;
  const gravity = -2;
  let isJumping = false;
  let velocity = 0;

  document.addEventListener("click", (event) => {
      if (event.button === 0) {
          playerJump();
      }
  });

  document.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
          event.preventDefault();
          playerJump();
      }
  });

  function playerJump() {
      if (isJumping) return;

      isJumping = true;
      const startY = y;
      const peakY = startY + jumpHeight;
      let goingUp = true;

      function movePlayer() {

          velocity += gravity;

          if (goingUp) {
              velocity = 7 / (y / peakY);
              if (y > peakY) {
                  y = peakY;
                  goingUp = false;
              }
          } else {
              if (y <= startY) {
                  y = startY;
                  isJumping = false;
                  player.style.bottom = `${y}px`;
                  return;
              }
          }

          y += velocity;
          player.style.bottom = `${y}px`;
          requestAnimationFrame(movePlayer);
      }

      requestAnimationFrame(movePlayer);
  }
}

  </script>
</body>
</html>
